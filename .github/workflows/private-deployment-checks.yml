name: FamilyRoot private Docker checks

on:
  push:
    branches:
      - deploy/familyroot-private-docker-2026-11-15
  pull_request:
    paths:
      - "deploy/**"
      - "backend/security.py"
      - "backend/tests/**"
      - ".gitignore"
      - ".github/workflows/private-deployment-checks.yml"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal backend test dependencies
        run: python -m pip install "flask>=3,<4" "flask-cors>=4,<6"
      - name: Compile backend
        run: python -m compileall -q backend app.py
      - name: Run security and private deployment regression tests
        run: cd backend && python -m unittest discover -s tests -v
      - name: Verify scripts syntax
        run: bash -n deploy/setup-private.sh deploy/backup-private.sh deploy/start-lan-web.sh
      - name: Generate temporary CI-only secrets
        run: bash deploy/setup-private.sh
      - name: Validate isolated Compose stack
        run: docker compose -f deploy/compose.private.yml config --quiet
      - name: Validate HTTPS home-LAN proxy overlay
        run: |
          docker compose -f deploy/compose.private.yml -f deploy/compose.lan.yml config --quiet
          docker compose -f deploy/compose.private.yml -f deploy/compose.lan.yml config --services | grep -Fx familyroot-web
          test "$(grep -c 'tls internal' deploy/Caddyfile.lan)" = 1
          test "$(grep -c '192.168.1.44:15443:443' deploy/compose.lan.yml)" = 1
          grep -Fq 'default_sni 192.168.1.44' deploy/Caddyfile.lan
      - name: Parse Caddy LAN HTTPS config
        run: docker run --rm -v "$PWD/deploy/Caddyfile.lan:/etc/caddy/Caddyfile:ro" caddy:2.10.2-alpine caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile --pretty >/dev/null
