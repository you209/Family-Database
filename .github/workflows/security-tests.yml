name: Backend security tests
on:
  push:
    branches: [security/phase1-auth-backup-hardening]
  pull_request:
    branches: [main]
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal test dependencies
        run: python -m pip install 'flask>=3,<4' 'flask-cors>=4,<6'
      - name: Compile backend
        run: python -m compileall -q backend app.py
      - name: Run security tests
        run: cd backend && python -m unittest discover -s tests -v
