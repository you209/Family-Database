name: GEDCOM export tests
on:
  push:
    branches: [repair/phase2-gedcom-integrity]
  pull_request:
    branches: [main]
jobs:
  exports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'flask>=3,<4'
      - run: python -m compileall -q backend
      - run: cd backend && python -m unittest discover -s tests -p 'test_export.py' -v
